<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <div class="logo"> 
            <img id=logo src="travel2.jpg" alt="logo"> 
            <p>Travel Together</p>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="p1.html">Acceuil</a></li>
                <li><a href="apropos.html">A propos</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <a href="#popup" id="reser">Reservation</a>
    </header>
    
    <div id="popup" class="popup">
        <div class="popup-content">
            <a href="#" class="close">&times;</a>
            <h2>Réservation</h2>
            <form class="reservation-form">
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" required>
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <select required>
                        <option value="">Choisir une destination</option>
                        <option value="paris">Paris</option>
                        <option value="london">Londres</option>
                        <option value="tokyo">Tokyo</option>
                        <option value="newyork">New York</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date de départ</label>
                    <input type="date" required>
                </div>
                <div class="form-group">
                    <label>Nombre de personnes</label>
                    <input type="number" min="1" required>
                </div>
                <button type="submit" class="submit-btn">Réserver</button>
            </form>
        </div>
    </div>
    <div class="header">Contact</div>
    <div class="contact-container">
        <!-- Form Section -->
        <div class="form">
            <h2>Formulaire de Contact</h2>
            <form action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom Complet :</label>
                        <input type="text" id="nom" name="nom" placeholder="Votre nom complet" required>
                    </div>
                    <div class="form-group">
                        <label for="objet">Objet :</label>
                        <input type="text" id="objet" name="objet" placeholder="Objet de votre message" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email :</label>
                        <input type="email" id="email" name="email" placeholder="Votre adresse email" required>
                    </div>
                    <div class="form-group">
                        <label for="numero">Numéro :</label>
                        <input type="tel" id="numero" name="numero" placeholder="Votre numéro de téléphone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date :</label>
                        <input type="date" id="date" name="date">
                    </div>
                    <div class="form-group">
                        <label for="adresse">Adresse :</label>
                        <input type="text" id="adresse" name="adresse" placeholder="Votre adresse">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="message">Message :</label>
                        <textarea id="message" name="message" placeholder="Votre message" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="details">Autres Détails :</label>
                        <textarea id="details" name="details" placeholder="Autres informations" rows="4"></textarea>
                    </div>
                </div>
                <button type="submit">Envoyer</button>
            </form>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="details">
        <h2>Nous Contacter</h2>
        <p><strong>Email :</strong> contact@gmail.com</p>
        <p><strong>Téléphone :</strong> +216 123 456 789</p>
        <p><strong>Fax :</strong> +216 987 654 321</p>
        <p><strong>Adresse :</strong> Rue Mohammed V, Tunis, Tunisie</p>
    </footer>
</body>
</html>
