<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="header">Contact</div>
    <div class="contact-container">
        <!-- Form Section -->
        <div class="form">
            <h2>Formulaire de Contact</h2>
            <form action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom Complet :</label>
                        <input type="text" id="nom" name="nom" placeholder="Votre nom complet" required>
                    </div>
                    <div class="form-group">
                        <label for="objet">Objet :</label>
                        <input type="text" id="objet" name="objet" placeholder="Objet de votre message" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email :</label>
                        <input type="email" id="email" name="email" placeholder="Votre adresse email" required>
                    </div>
                    <div class="form-group">
                        <label for="numero">Numéro :</label>
                        <input type="tel" id="numero" name="numero" placeholder="Votre numéro de téléphone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date :</label>
                        <input type="date" id="date" name="date">
                    </div>
                    <div class="form-group">
                        <label for="adresse">Adresse :</label>
                        <input type="text" id="adresse" name="adresse" placeholder="Votre adresse">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="message">Message :</label>
                        <textarea id="message" name="message" placeholder="Votre message" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="details">Autres Détails :</label>
                        <textarea id="details" name="details" placeholder="Autres informations" rows="4"></textarea>
                    </div>
                </div>
                <button type="submit">Envoyer</button>
            </form>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="details">
        <h2>Nous Contacter</h2>
        <p><strong>Email :</strong> contact@gmail.com</p>
        <p><strong>Téléphone :</strong> +216 123 456 789</p>
        <p><strong>Fax :</strong> +216 987 654 321</p>
        <p><strong>Adresse :</strong> Rue Mohammed V, Tunis, Tunisie</p>
    </footer>
</body>
</html>
